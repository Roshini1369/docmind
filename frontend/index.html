<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocMind</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1f1f1d; --muted: #6b6b66; --line: #e4e2dc;
    --accent: #c4552d; --accent-soft: #fbeee8; --ok: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #98978f; --line: #33322f;
            --accent: #e8825c; --accent-soft: #2b1f1a; --ok: #5fbf85; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; }
  aside { width: 290px; background: var(--panel); border-right: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 12.5px; margin-top: -8px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); cursor: pointer; font-size: 13.5px; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .doc { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; gap: 8px; }
  .doc small { color: var(--muted); display: block; }
  .doc button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .doc button:hover { color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; }
  .bubble { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; word-wrap: break-word; }
  .user .bubble { background: var(--accent-soft); border-color: transparent; }
  .cite { display: inline-block; background: var(--accent); color: #fff; border-radius: 5px; padding: 0 5px; font-size: 11.5px; font-weight: 600; cursor: pointer; vertical-align: 1px; }
  .trace { margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  .step b { color: var(--ok); font-weight: 600; text-transform: capitalize; }
  .sources { margin-top: 8px; display: grid; gap: 6px; }
  details { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  details p { margin: 6px 0 2px; white-space: pre-wrap; color: var(--ink); }
  .err { color: #c0392b; }
  form { display: flex; gap: 10px; padding: 16px 24px 22px; max-width: 808px; width: 100%; margin: 0 auto; }
  input[type=text] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button.send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: wait; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  @media (max-width: 760px) { aside { display: none; } }
</style>
</head>
<body>
<aside>
  <div>
    <h1>Doc<span>Mind</span></h1>
  </div>
  <div class="tag">Multi-agent RAG research assistant</div>
  <label class="drop" id="drop">
    Drop a PDF, TXT or MD file<br>or click to upload
    <input id="file" type="file" accept=".pdf,.txt,.md" hidden>
  </label>
  <div id="docs"></div>
  <div class="tag" id="health"></div>
</aside>

<main>
  <div id="chat">
    <div class="empty" id="empty">
      <h2 style="color:var(--ink)">Ask your documents anything</h2>
      Upload a file on the left, then ask a question. You'll see each agent
      (memory, planner, researcher, writer, critic) work in real time, with cited sources.
    </div>
  </div>
  <form id="form">
    <input type="text" id="q" placeholder="Ask a question about your documents..." autocomplete="off" required>
    <button class="send" id="send">Ask</button>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), form = $("form"), q = $("q"), sendBtn = $("send");
let history = [];

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const render = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(\d+)\]/g, '<span class="cite" data-n="$1">$1</span>');

async function refreshDocs() {
  const docs = await (await fetch("/api/documents")).json();
  $("docs").innerHTML = docs.length
    ? docs.map((d) => `<div class="doc"><div>${esc(d.name)}<small>${d.chunks} chunks</small></div><button title="Delete" data-name="${esc(d.name)}">&times;</button></div>`).join("")
    : '<div class="tag">No documents yet.</div>';
}

$("docs").addEventListener("click", async (e) => {
  const name = e.target.dataset?.name;
  if (!name) return;
  await fetch("/api/documents/" + encodeURIComponent(name), { method: "DELETE" });
  refreshDocs();
});

async function upload(file) {
  const fd = new FormData();
  fd.append("file", file);
  $("drop").firstChild.textContent = "Indexing " + file.name + "...";
  const res = await fetch("/api/documents", { method: "POST", body: fd });
  $("drop").firstChild.textContent = res.ok ? "Indexed! Drop another file" : "Upload failed: " + ((await res.json()).detail || res.status);
  refreshDocs();
}
$("file").addEventListener("change", (e) => e.target.files[0] && upload(e.target.files[0]));
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); });

function addMsg(role) {
  $("empty")?.remove();
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  chat.appendChild(wrap);
  return wrap;
}
const scroll = () => (chat.scrollTop = chat.scrollHeight);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  q.value = ""; sendBtn.disabled = true;

  addMsg("user").innerHTML = `<div class="bubble">${esc(question)}</div>`;
  const bot = addMsg("bot");
  bot.innerHTML = '<div class="trace"></div><div class="bubble">Thinking...</div><div class="sources"></div>';
  const trace = bot.querySelector(".trace"), bubble = bot.querySelector(".bubble"), srcBox = bot.querySelector(".sources");
  let sources = [];

  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, history }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split("\n\n"); buf = events.pop();
      for (const ev of events) {
        const type = /^event: (.+)$/m.exec(ev)?.[1], data = JSON.parse(/^data: (.+)$/m.exec(ev)?.[1] || "{}");
        if (type === "step") {
          trace.insertAdjacentHTML("beforeend", `<span class="step" title="${esc(data.detail)}"><b>${esc(data.agent.replace("_", " "))}</b> &middot; ${esc(data.detail.slice(0, 70))}</span>`);
        } else if (type === "answer") {
          sources = data.sources;
          bubble.innerHTML = render(data.answer);
          srcBox.innerHTML = sources.map((s) => `<details id="src-${bot.dataset.id = bot.dataset.id || Date.now()}-${s.n}"><summary>[${s.n}] ${esc(s.source)} &middot; page ${s.page} &middot; score ${s.score}</summary><p>${esc(s.text)}</p></details>`).join("");
          history.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
        } else if (type === "error") {
          bubble.innerHTML = `<span class="err">${esc(data.message)}</span>`;
        }
        scroll();
      }
    }
  } catch (err) {
    bubble.innerHTML = `<span class="err">${esc(String(err))}</span>`;
  }
  sendBtn.disabled = false; q.focus(); scroll();
});

// clicking a citation badge opens its source
chat.addEventListener("click", (e) => {
  const n = e.target.dataset?.n;
  if (!n) return;
  const d = e.target.closest(".msg").querySelectorAll("details")[n - 1];
  if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); }
});

fetch("/api/health").then((r) => r.json()).then((h) => {
  $("health").textContent = h.api_key_set ? "Model: " + h.model : "⚠ ANTHROPIC_API_KEY not set";
});
refreshDocs();
</script>
</body>
</html>
